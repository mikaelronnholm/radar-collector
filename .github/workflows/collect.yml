name: Collect radar news

on:
  schedule:
    - cron: "17 4 * * *"   # every day 04:17 UTC (05:17 Stockholm in winter)
  workflow_dispatch: {}      # lets you start it by hand from the Actions tab
  push:                      # runs when the script or the configuration changes
    branches: [main]
    paths: ["collect.py", "research.py", "ai_scan.py", "config/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news
        run: python collect.py
      - name: Collect research
        run: python research.py
      - name: AI scan (Gemini and ChatGPT)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ai_scan.py
      - name: Save results
        run: |
          git config user.name "radar-collector"
          git config user.email "radar-collector@users.noreply.github.com"
          git add data
          git commit -m "Daily collection $(date -u +%F)" || echo "No changes"
          git pull --rebase -q || true
          git push
