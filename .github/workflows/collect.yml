name: Collect radar news

on:
  schedule:
    - cron: "17 4 * * *"   # every day 04:17 UTC (05:17 Stockholm in winter)
  workflow_dispatch: {}      # lets you start it by hand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python collect.py
      - name: Save results
        run: |
          git config user.name "radar-collector"
          git config user.email "radar-collector@users.noreply.github.com"
          git add data
          git commit -m "Daily collection $(date -u +%F)" || echo "No changes"
          git push
